<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Quiz Section</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">  
    <script src="js/anim.js"></script> 
    <style>
    body {
        padding: 0;
        font-family: "Poppins", sans-serif;
    }
    
    .grid-container {
        margin: 0 60px 0;
        display: grid;
        grid-template-columns: auto auto;
        align-items: center;
        gap: 20px; /* Menambahkan jarak antar item grid */
    }
    
    .item1 {
        background-color: white;
        height: 400px;
        width: auto;
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Menengahkan konten secara vertikal */
        align-items: flex-start; /* Menengahkan konten secara horizontal dengan tetap rata kiri */
        overflow: hidden;
    }

    
    .item1 img {
        margin-left: 10px;
        height: 160px;
        max-width: 100%;
    }
    
    .button {
        margin-left: 10px;
        background-color: black;
        color: white;
        border-radius: 50px;
        padding: 20px 30px; /* Ukuran padding tombol */
        font-size: 16pt;
        text-align: left;
        text-decoration: none;
        letter-spacing: 4px;
        transition: transform 0.4s ease, box-shadow 0.3s ease;
    }
    .button:hover {
        background-color: white;
        color: black; 
        transform: scale(1.01);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);   
        font-weight: 900;
        letter-spacing: 3px;
    }
    .box {
        background-color: white;
        display: flex;
        justify-content: right;
        margin-right: 10px; /* Rata tengah konten secara horizontal */
        align-items: center; /* Rata tengah konten secara vertical */
        height: 400px;
        overflow: hidden; /* Menghindari konten meluap */
    }
    
    .box img {
        height: 400px;
        width: auto;
    }
    .detail{
        margin: 15px 0 30px 10px;
    }
    
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="item1">
            <img src="img/cari.png" alt="Quiz 1">
            <p class="detail">Serangkaian kuis analisis kondisi kulit untuk menentukan produk<br> yang tepat sesuai kebutuhan perawatan kulit Anda.</p>
            <a class="button" href="/quiz/quiz3.html">COBA QUIZ SEKARANG</a>
        </div>
        <div class="box">
            <img id="myImg" src="img/1.png" alt="logo">
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Quiz Section</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">   
<style>
body {
margin: 0;
padding: 0;
font-family: "Poppins", sans-serif;
}
.product-tile__badges {
left: 0;
letter-spacing: 0;
line-height: .9rem;
padding-top: 13px;
position: absolute;
text-align: center;
text-transform: uppercase;
top: 0;
}
.badge {
-ms-flex-line-pack: center;
-webkit-box-pack: center;
-ms-flex-pack: center;
align-content: center;
background-color: rgb(185, 14, 14);
display: grid;
font-family: UniversLTStd-Bold;
font-family: Tt-Chocolate;
font-size: .625rem;
font-size: .8125rem;
font-weight: 400;
height: 1.6875rem;
justify-content: center;
letter-spacing: 0;
letter-spacing: normal;
line-height: 1.6;
line-height: .975rem;
padding: .34375rem .625rem;
place-content: center;
text-align: left;
text-transform: lowercase;
white-space: nowrap;
}
.badge--badgetext {
border-radius: .25rem;
color: white;
margin-left: auto;
}

.badge--badgetext:after, :before {
-webkit-box-sizing: inherit;
box-sizing: inherit;
}
</style>

</head>
<body>
    <div class="product-tile__badges">
        <div class="badge">
            <span class="badge--badgetext">New Product</span>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teratu Beauty</title>
    <link rel="icon" href="../img/logokcl.png" type="image/png" sizes="16x16">
    <script src="https://kit.fontawesome.com/4a3b1f73a2.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;800&display=swap" rel="stylesheet">   
    <script src="js/jQuery3.4.1.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="productdetailstyles.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadHTML('#header', '../header.html');
            loadHTML('#footer', '../footer.html');
          
           const buttons = document.querySelectorAll('.button');
            const textContent = document.getElementById('text-content');
            let currentActiveButton = null;

            function updateContent(buttonId, title, content) {
                buttons.forEach(button => button.classList.remove('active'));

                textContent.innerHTML = `
                    <h1>${title}</h1>
                    <p>${content}</p>
                `;

                document.getElementById(buttonId).classList.add('active');
                currentActiveButton = buttonId;
            }

            document.getElementById('ingredient').addEventListener('click', function() {
                if (currentActiveButton === 'ingredient') {
                    textContent.innerHTML =  `
                        <h1>INTENSIVE ACNE SOLUTION</h1>
                        <p>Intensive Acne Solution adalah Lotion Jerawat yg membantu mengeringkan jerawat, menjaga keseimbangan kondisi, mengurangi minyak berlebih.</p>
                        <div class="images-container">
                            <img src="informationlogo/age16.png" alt="Description" class="logo-img">
                            <img src="informationlogo/allskin.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freealc.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freepar.png" alt="Description" class="logo-img">
                            <img src="informationlogo/safe.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freefrag.png" alt="Description" class="logo-img">
                            <img src="informationlogo/pao6.png" alt="Description" class="logo-img">
                        </div>    
                    `;
                    buttons.forEach(button => button.classList.remove('active'));
                    currentActiveButton = null;
                } else {
                    updateContent('ingredient', 'KEY INGREDIENT', `
                    <ol>
                        <li> Sulfur: sebagai anti-acne dengan membantu membuka pori kulit dan menyerap sebum penyebab jerawat, dapat membantu mengeringkan sel kulit mati agar tidak menyumbat pori.</li>
                        <br>
                        <li> Salycilic Acid: sebagai chemical exfoliant, membantu mengangkat sel kulit mati yang menutup pori dan membersihkan pori dari sel kulit mati dan sebum penyebab jerawat.</li>
                    </ol>
                    `);
                }
            });

            document.getElementById('how-to-use').addEventListener('click', function() {
                if (currentActiveButton === 'how-to-use') {
                    textContent.innerHTML = `
                        <h1>INTENSIVE ACNE SOLUTION</h1>
                        <p>Intensive Acne Solution adalah Lotion Jerawat yg membantu mengeringkan jerawat, menjaga keseimbangan kondisi, mengurangi minyak berlebih.</p>
                        <div class="images-container">
                            <img src="informationlogo/age16.png" alt="Description" class="logo-img">
                            <img src="informationlogo/allskin.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freealc.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freepar.png" alt="Description" class="logo-img">
                            <img src="informationlogo/safe.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freefrag.png" alt="Description" class="logo-img">
                            <img src="informationlogo/pao6.png" alt="Description" class="logo-img">
                        </div>    
                    `;
                    buttons.forEach(button => button.classList.remove('active'));
                    currentActiveButton = null;
                } else {
                    updateContent('how-to-use', 'HOW TO USE', `
                    <ol>
                        <li> Kocok dahulu sebelum digunakan.</li>
                        <br>
                        <li> Oleskan tiap malam pada area berjerawat, atau sesuai kebutuhan.</li>
                        <br>
                        <li> Gunakan pagi & malam hari secara rutin untuk hasil yang maksimal.</li>
                    </ol>
                    `);
                }
            });

            document.getElementById('testimoni').addEventListener('click', function() {
                if (currentActiveButton === 'testimoni') {
                    textContent.innerHTML =  `
                        <h1>INTENSIVE ACNE SOLUTION</h1>
                        <p>Intensive Acne Solution adalah Lotion Jerawat yg membantu mengeringkan jerawat, menjaga keseimbangan kondisi, mengurangi minyak berlebih.</p>
                        <div class="images-container">
                            <img src="informationlogo/age16.png" alt="Description" class="logo-img">
                            <img src="informationlogo/allskin.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freealc.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freepar.png" alt="Description" class="logo-img">
                            <img src="informationlogo/safe.png" alt="Description" class="logo-img">
                            <img src="informationlogo/freefrag.png" alt="Description" class="logo-img">
                            <img src="informationlogo/pao6.png" alt="Description" class="logo-img">
                        </div>    
                    `;
                    buttons.forEach(button => button.classList.remove('active'));
                    currentActiveButton = null;
                } else {
                    updateContent('testimoni', 'TESTIMONI', `
                        <div class="testimoni">
                            <img src="skincare/Intensive Acne Solution/2.png">
                            <img src="skincare/Intensive Acne Solution/3.png">
                            <img src="skincare/Intensive Acne Solution/4.png">
                        </div>
                    `);
                }
            });
        });
    </script>
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <div class="buttons">
            <button id="ingredient" class="button">ingredient</button>
            <button id="how-to-use" class="button">How to Use</button>
            <button id="testimoni" class="button">Testimoni</button>
        </div>    

        <div class="text-content" id="text-content">
            <h1>INTENSIVE ACNE SOLUTION</h1>
            <p>Intensive Acne Solution adalah Lotion Jerawat yg membantu mengeringkan jerawat, menjaga keseimbangan kondisi, mengurangi minyak berlebih.</p>
            <div class="images-container">
                <img src="informationlogo/age16.png" alt="Description" class="logo-img">
                <img src="informationlogo/allskin.png" alt="Description" class="logo-img">
                <img src="informationlogo/freealc.png" alt="Description" class="logo-img">
                <img src="informationlogo/freepar.png" alt="Description" class="logo-img">
                <img src="informationlogo/safe.png" alt="Description" class="logo-img">
                <img src="informationlogo/freefrag.png" alt="Description" class="logo-img">
                <img src="informationlogo/pao6.png" alt="Description" class="logo-img">
            </div>
        </div>

        <div class="left swiper">
            <div class="big-img">
                <img src="skincare/Intensive Acne Solution/1.png" alt="Product Image">
            </div>
            <div class="slider-wrapper">
                <button class="buttonprev">
                    <img src="prevbtn.png" alt="Previous">
                </button>

                <button class="buttonnext">
                    <img src="nextbtn.png" alt="Next">
                </button>

                <div class="card-list swiper-wrapper">
                    <div class="card-item swiper-slide">
                        <img src="skincare/Intensive Acne Solution/1.png" alt="Product Image"
                        class="image">
                    </div>
                </div>
                
                <button class="shop-now-button">SHOP NOW</button> 
            </div>

        </div>      
    </div>
    <div id="footer"></div>
  
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="productdetail.js"></script>
</body>
</html>

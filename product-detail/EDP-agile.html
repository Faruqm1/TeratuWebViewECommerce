<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teratu Beauty</title>
    <link rel="icon" href="img/logokcl.png" type="image/png" sizes="16x16">
    <script src="https://kit.fontawesome.com/4a3b1f73a2.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet">   
    <script src="js/jQuery3.4.1.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="productdetailstyles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadHTML('#header', 'header.html');
            loadHTML('#footer', 'footer.html');
          
           const buttons = document.querySelectorAll('.button');
            const textContent = document.getElementById('text-content');
            let currentActiveButton = null;

            function updateContent(buttonId, title, content) {
                buttons.forEach(button => button.classList.remove('active'));

                textContent.innerHTML = `
                    <h1>${title}</h1>
                    <p>${content}</p>
                `;

                document.getElementById(buttonId).classList.add('active');
                currentActiveButton = buttonId;
            }

            document.getElementById('ingredient').addEventListener('click', function() {
                if (currentActiveButton === 'ingredient') {
                    textContent.innerHTML =  `
                        <h1>EAU DE PARFUM AGILE</h1>
                        <p>The scent is full of ambition. It's cool, deep, clean, and fresh. <br> Masculine scent to accompany you to attend an important event, it makes you feel like you are the coolest man. Feel more confident and ready to take on the day.</p>
                    `;
                    buttons.forEach(button => button.classList.remove('active'));
                    currentActiveButton = null;
                } else {
                    updateContent('ingredient', 'KEY INGREDIENT', `
                    <ol>
                        <li>Top Notes: Citrus, Cardamom
                        </li>
                        <br>
                        <li>Middle Notes: Aquozone, Geranium, Clary
                        </li>
                        <br>
                        <li>Base Notes: Patchouli, Moss (Sea), Amber
                        </li>
                    </ol> 
                    `);
                }
            });

            document.getElementById('how-to-use').addEventListener('click', function() {
                if (currentActiveButton === 'how-to-use') {
                    textContent.innerHTML = `
                        <h1>EAU DE PARFUM AGILE</h1>
                        <p>The scent is full of ambition. It's cool, deep, clean, and fresh. <br> Masculine scent to accompany you to attend an important event, it makes you feel like you are the coolest man. Feel more confident and ready to take on the day.</p>
                    `;
                    buttons.forEach(button => button.classList.remove('active'));
                    currentActiveButton = null;
                } else {
                    updateContent('how-to-use', 'HOW TO USE', `
                    <p>Apply perfume to the body pulse points only, such as on the</p>
                    <ul>
                        <li>wrists</li>
                        <br>
                        <li>inner elbows</li>
                        <br>
                        <li>around the neck</li>
                        <br>
                        <li>under the stomach</li>
                        <br>
                        <li>behind the knees</li>
                        <br>
                        <li>on the ankles</li>
                        <br>
                        <li>and on the calves</li>
                    </ul>
                    <p> as these parts tend to have higher body temperature which help to spread the perfume scent throughout the body.</p>
                    `);
                }
            });
        });
    </script>
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <div class="buttons">
            <button id="ingredient" class="button">ingredient</button>
            <button id="how-to-use" class="button">Little Tip</button>
        </div>    

        <div class="text-content" id="text-content">
            <h1>EAU DE PARFUM AGILE</h1>
            <p>The scent is full of ambition. It's cool, deep, clean, and fresh. <br> Masculine scent to accompany you to attend an important event, it makes you feel like you are the coolest man. Feel more confident and ready to take on the day.</p>
        </div>

        <div class="left swiper">
            <div class="big-img">
                <img src="product-detail/perfume-series/EDP agile/1.png" alt="Product Image">
            </div>
            <div class="slider-wrapper">
                <button class="buttonprev">
                    <img src="prevbtn.png" alt="Previous">
                </button>

                <button class="buttonnext">
                    <img src="nextbtn.png" alt="Next">
                </button>

                <div class="card-list swiper-wrapper">
                    <div class="card-item swiper-slide">
                        <img src="product-detail/perfume-series/EDP agile/1.png" alt="Product Image"
                        class="image">
                    </div>

                    <div class="card-item swiper-slide">
                        <img src="product-detail/perfume-series/EDP agile/2.png" alt="Product Image"
                        class="image">
                    </div>

                    <div class="card-item swiper-slide">
                        <img src="product-detail/perfume-series/EDP agile/3.png" alt="Product Image"
                        class="image">
                    </div>

                    <div class="card-item swiper-slide">
                        <img src="product-detail/perfume-series/EDP agile/4.png" alt="Product Image"
                        class="image">
                    </div>

                    <div class="card-item swiper-slide">
                        <img src="product-detail/perfume-series/EDP agile/5.png" alt="Product Image"
                        class="image">
                    </div>
                </div>

                <button class="shop-now-button">SHOP NOW</button>   
            </div>

        </div>      
    </div>
    <div id="footer"></div>
  
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="productdetail.js"></script>
</body>
</html>

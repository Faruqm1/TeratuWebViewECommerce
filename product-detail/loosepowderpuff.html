<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teratu Beauty</title>
    <link rel="icon" href="../img/logokcl.png" type="image/png" sizes="16x16">
    <script src="https://kit.fontawesome.com/4a3b1f73a2.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet">   
    <script src="js/jQuery3.4.1.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="productdetailstyles.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadHTML('#header', '../header.html');
            loadHTML('#footer', '../footer.html');
          
           const buttons = document.querySelectorAll('.button');
            const textContent = document.getElementById('text-content');
            let currentActiveButton = null;

            function updateContent(buttonId, title, content) {
                buttons.forEach(button => button.classList.remove('active'));

                textContent.innerHTML = `
                    <h1>${title}</h1>
                    <p>${content}</p>
                `;

                document.getElementById(buttonId).classList.add('active');
                currentActiveButton = buttonId;
            }

            document.getElementById('how-to-use').addEventListener('click', function() {
                if (currentActiveButton === 'how-to-use') {
                    textContent.innerHTML = `
                        <h1>LOOSE POWDER PUFF</h1>
                        <p>Teratu Beauty Matte Blur Set Loose Powder Puff digunakan untuk mengaplikasikan bedak tabur secara lembut dan halus. Dibuat menggunakan bahan Chemical Fiber Dacron dengan diameter 5,4 cm dan tebal 1,2 cm</p>   
                    `;
                    buttons.forEach(button => button.classList.remove('active'));
                    currentActiveButton = null;
                } else {
                    updateContent('how-to-use', 'HOW TO USE', `
                    <ol>
                        <li> Basahi bibir dengan air atau oleskan lip balm/lip scrub/lip oil.</li>
                        <br>
                        <li> Gosok perlahan bibir dengan brush (menggunakan sisi yang bulat-bulat lebar / sisi yang lebih rapat).</li>
                        <br>
                        <li> Sel kulit mati di bibir pun terangkat.</li>
                        <br>
                        <li> Lap bibir dengan tissue.</li>
                        <br>
                        <li> Oleskan lip balm / lip serum kembali agar bibir lembab.</li>
                    </ol> 
                    `);
                }
            });
        });
    </script>
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <div class="buttons">
            <button id="how-to-use" class="button">How to Use</button>
        </div>    

        <div class="text-content" id="text-content">
            <h1>LOOSE POWDER PUFF</h1>
            <p>Teratu Beauty Matte Blur Set Loose Powder Puff digunakan untuk mengaplikasikan bedak tabur secara lembut dan halus. Dibuat menggunakan bahan Chemical Fiber Dacron dengan diameter 5,4 cm dan tebal 1,2 cm</p>
        </div>

        <div class="left swiper">
            <div class="big-img">
                <img src="/product-detail/tools/Loose Powder Puff/1.png" alt="Product Image">
            </div>
            <div class="slider-wrapper">
                <button class="buttonprev">
                    <img src="prevbtn.png" alt="Previous">
                </button>

                <button class="buttonnext">
                    <img src="nextbtn.png" alt="Next">
                </button>

                <div class="card-list swiper-wrapper">
                    <div class="card-item swiper-slide">
                        <img src="/product-detail/tools/Loose Powder Puff/1.png" alt="Product Image"
                        class="image">
                    </div>
                    <div class="card-item swiper-slide">
                        <img src="/product-detail/tools/Loose Powder Puff/2.png" alt="Product Image"
                        class="image">
                    </div>
                    <div class="card-item swiper-slide">
                        <img src="/product-detail/tools/Loose Powder Puff/3.png" alt="Product Image"
                        class="image">
                    </div>
                </div>

                <button class="shop-now-button">SHOP NOW</button>   
            </div>

        </div>      
    </div>
    <div id="footer"></div>
  
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="productdetail.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Teratu Beauty</title>
    <link rel="icon" href="img/logokcl.png" type="image/png" sizes="16x16">
    <script src="https://kit.fontawesome.com/4a3b1f73a2.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet">   
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .background-image {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('img/wpquiz3.png'); /* Ganti dengan path gambar latar belakang Anda */
            background-size: cover;
            background-position-x: calc(0px - 40px);
            z-index: -1; /* Pastikan gambar berada di belakang elemen lain */
        }

        .button-img {
            position: absolute;
            left: 100px;
            bottom: 80px;
            width: 460px;
            height: 70px;
            z-index: 1;
            transition: transform 0.4s;
        }
        .button-img:hover {
            transform: scale(1.05);
        }

        .text-container {
            position: absolute;
            left: 100px;
            bottom: 160px;
            font-size: 16pt;
            color: black;
            z-index: 1; /* Pastikan teks berada di atas latar belakang */
            width: 80%; /* Sesuaikan lebar teks jika perlu */
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    <div class="text-container">
        <p>
            Yuk cari tahu skincare yang dibutuhkan
            <br>
            kulit kamu tanpa takut breakout lagi!
        </p>
    </div>
    <a href="quiz/quiz3-1.html">
        <img class="button-img" src="img/button-start.png" alt="Mulai">
    </a>
</body>
</html>
